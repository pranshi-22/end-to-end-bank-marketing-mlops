services:
  bank-marketing-api:
    image: ghcr.io/pranshi-22/end-to-end-bank-marketing-mlops:main
    container_name: bank-marketing-container
    ports:
      - "8000:8000"
      - "8501:8501"
    volumes:
      - ./logs:/app/logs
      - ./data/processed:/app/data/processed:ro
      - ./reports/monitoring:/app/reports/monitoring
    restart: unless-stopped